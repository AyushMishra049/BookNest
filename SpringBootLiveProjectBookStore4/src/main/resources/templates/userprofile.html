<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">

<title>My Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

.profile-box{
    background:white;
    padding:35px;
    border-radius:15px;
    margin-top:50px;
    box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

.heading{
    font-weight:bold;
    margin-bottom:30px;
}

.form-control{
    height:50px;
}

.btn-save{
    height:50px;
    font-size:18px;
    font-weight:bold;
}

.success{
    color:green;
    margin-bottom:15px;
    text-align:center;
}

.error{
    color:red;
    margin-bottom:15px;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="profile-box">

                <h2 class="text-center heading">
                    My Profile
                </h2>

                <div th:if="${successMsg}">
                    <div class="success" th:text="${successMsg}"></div>
                </div>

                <div th:if="${errorMsg}">
                    <div class="error" th:text="${errorMsg}"></div>
                </div>

                <form th:action="@{/updateprofile}"
                      th:object="${user}"
                      method="post">

                    <!-- Hidden ID -->

                    <input type="hidden" th:field="*{id}">

                    <!-- Name -->

                    <div class="mb-4">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{name}"
                               required>

                    </div>

                    <!-- Email -->

                    <div class="mb-4">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input type="email"
                               class="form-control"
                               th:field="*{email}"
                               required>

                    </div>

                    <!-- Phone -->

                    <div class="mb-4">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{phone}"
                               required>

                    </div>

                    <!-- Password -->

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               class="form-control"
                               name="password"
                               th:value="${user.password}"
                               required>

                    </div>

                    <!-- Button -->

                    <button type="submit"
                            class="btn btn-dark w-100 btn-save">

                        Update Profile

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
