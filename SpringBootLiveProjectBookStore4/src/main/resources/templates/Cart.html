<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>My Cart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

    body{
        background:#f4f4f4;
        font-family:Arial, sans-serif;
    }

    .cart-container{
        margin-top:40px;
    }

    .cart-card{
        background:white;
        border-radius:15px;
        padding:20px;
        margin-bottom:20px;
        box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

</style>

</head>

<body>

<div class="container cart-container">

    <h1 class="text-center mb-5">
        🛒 My Cart
    </h1>

    <form th:action="@{/update/cart}"
          method="post">

        <div class="row">

            <div class="col-lg-10 mx-auto">

                <!-- Loop Start -->
                <div th:each="cart : ${cartItems}"
                     class="cart-card">

                    <div class="row align-items-center">

                        <!-- Hidden Fields -->
                        <input type="hidden"
                               name="id[]"
                               th:value="${cart.id}">

                        <input type="hidden"
                               name="bookid[]"
                               th:value="${cart.bookid}">

                        <input type="hidden"
                               name="userid[]"
                               th:value="${cart.userid}">

                        <!-- Book Details -->
                        <div class="col-md-5">

                            <h4 th:text="${cart.bookname}">
                                Book Name
                            </h4>

                            <p class="text-muted mb-1">

                                Author :
                                <span th:text="${cart.bookauther}">
                                    Author Name
                                </span>

                            </p>

                            <p class="mb-0">

                                Type :
                                <span th:text="${cart.booktype}">
                                    Type
                                </span>

                            </p>

                        </div>

                        <!-- Quantity -->
                        <div class="col-md-2">

                            <input type="number"
                                   class="form-control quantity"
                                   name="bookquantity[]"
                                   th:value="${cart.bookquantity}"
                                   min="1"
                                   th:attr="data-price=${cart.bookprice}">

                        </div>

                        <!-- Total Price -->
                        <div class="col-md-2 text-center">

                            <h5 class="mb-0">

                                ₹<span class="total-price"
                                        th:text="${cart.totalprice}">
                                </span>

                            </h5>

                            <input type="hidden"
                                   class="hidden-total"
                                   name="totalprice[]"
                                   th:value="${cart.totalprice}">

                        </div>

                        <!-- Remove -->
                        <div class="col-md-3 text-end">

                            <a th:href="@{/remove/cart/{id}(id=${cart.id})}"
                               class="btn btn-danger">

                                Remove

                            </a>

                        </div>

                    </div>

                </div>
                <!-- Loop End -->

                <!-- Payment Button -->
                <div class="text-center mt-4">

                    <button type="submit"
                            class="btn btn-dark btn-lg">

                        Proceed To Payment

                    </button>

                </div>

            </div>

        </div>

    </form>

</div>

<script>

    let quantities = document.querySelectorAll(".quantity");

    quantities.forEach(function(input){

        input.addEventListener("input", function(){

            let price = parseInt(this.dataset.price);

            let quantity = parseInt(this.value);

            let total = price * quantity;

            // Update UI
            let totalPriceElement =
                this.closest(".row")
                    .querySelector(".total-price");

            totalPriceElement.innerText = total;

            // Update Hidden Input
            let hiddenTotal =
                this.closest(".row")
                    .querySelector(".hidden-total");

            hiddenTotal.value = total;

        });

    });

</script>

</body>
</html>
