<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Welcome</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:black;
        color:white;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
    }

    .welcome-box{
        text-align:center;
        animation:fadeIn 1.5s ease-in-out;
    }

    h1{
        font-size:60px;
        margin-bottom:20px;
        color:#00ffcc;
    }

    p{
        font-size:28px;
        letter-spacing:2px;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:scale(0.8);
        }

        to{
            opacity:1;
            transform:scale(1);
        }
    }

</style>

</head>
<body>

    <div class="welcome-box">

        <h1>WELCOME</h1>

        <p th:text="${username}"></p>

    </div>

<script>

    // 3 second baad dashboard open hoga

    setTimeout(function(){

        window.location.href="/dashboard";

    },3000);

</script>

</body>
</html>
