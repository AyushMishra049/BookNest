<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Order Page</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

    body{
        background:#f4f4f4;
        font-family:Arial, sans-serif;
    }

    .order-container{
        margin-top:50px;
    }

    .order-box{
        background:white;
        padding:30px;
        border-radius:15px;
        box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .address-box{
        background:#f8f9fa;
        padding:15px;
        border-radius:10px;
        margin-bottom:25px;
        border:1px solid #ddd;
    }

</style>

</head>

<body>

<div class="container order-container">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="order-box">

                <h2 class="text-center mb-4">
                    📦 Place Order
                </h2>
				<div th:if="${errorMsg}">
					<h3 style="color: red;" th:text="${errorMsg}"></h3>
				</div>

                <form th:action="@{/order-now}"
                      method="post">

                    <!-- Address Section -->

                    <div class="address-box">

                        <div class="d-flex justify-content-between align-items-center mb-2">

                            <h5>
                                Delivery Address
                            </h5>

                            <a th:href="@{/address}"
                               class="btn btn-sm btn-outline-dark">

                                Change Address

                            </a>

                        </div>

                        <p class="mb-1">
                            <b th:text="${address.name}"></b>
                        </p>

                        <p class="mb-1"
                           th:text="${address.phone}">
                        </p>

                        <p class="mb-1">
                            <span th:text="${address.houseno}"></span>
                            <span th:text="${address.area}"></span>,
                        </p>

                        <p class="mb-1"
                           th:text="${address.landmark}">
                        </p>

                        <p class="mb-0">
                            <span th:text="${address.city}"></span>,
                            <span th:text="${address.state}"></span>
                            -
                            <span th:text="${address.pincode}"></span>
                        </p>

                    </div>

                    <!-- Payment Mode -->

                    <div class="mb-4">

                        <label class="form-label">
                            Payment Mode
                        </label>

                        <select class="form-select"
                                name="paymentmode">

                            <option value="Cash On Delivery">
                                Cash On Delivery
                            </option>

                        </select>

                    </div>

                    <!-- Total Items -->

                    <div class="mb-4">

                        <label class="form-label">
                            Total Items
                        </label>

                        <input type="text"
                               class="form-control"
                               name="totalitems"
                               th:value="${totalItems}"
                               readonly>

                    </div>

                    <!-- Total Price -->

                    <div class="mb-4">

                        <label class="form-label">
                            Total Price
                        </label>

                        <input type="text"
                               class="form-control"
                               name="totalprice"
                               th:value="${totalPrice}"
                               readonly>

                    </div>

                    <!-- Order Button -->

                    <button type="submit"
                            class="btn btn-dark w-100">

                        Order Now

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
