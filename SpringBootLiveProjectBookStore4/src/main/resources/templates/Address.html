<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Address</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

.address-box{
    width:500px;
    background:white;
    padding:30px;
    margin:40px auto;
    border-radius:10px;
    box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

.btn-save{
    width:100%;
}

</style>

</head>
<body>

<div class="address-box">

    <h2>Add Address</h2>
	
	<div th:if="${successMsg}">
		<h3 style="color: green;" th:text="${successMsg}"></h3>
	</div>
	<div th:if="${errorMsg}">
		<h3 style="color: red;" th:text="${errorMsg}"></h3>
	</div>

	<form action="/save-address" method="post" th:object="${address}">

	    <div class="mb-3">
	        <label class="form-label">Full Name</label>
	        <input type="text"
	               th:field="*{name}"
	               th:value="${address.name}"
	               class="form-control"
	               required>
	    </div>

	    <div class="mb-3">
	        <label class="form-label">Phone Number</label>
	        <input type="text"
	               th:field="*{phone}"
	               th:value="${address.phone}"
	               class="form-control"
	               required>
	    </div>

	    <div class="mb-3">
	        <label class="form-label">House No / Building</label>
	        <input type="text"
	               th:field="*{houseno}"
	               class="form-control"
	               required>
	    </div>

	    <div class="mb-3">
	        <label class="form-label">Area / Street</label>
	        <input type="text"
	               th:field="*{area}"
	               class="form-control"
	               required>
	    </div>

	    <div class="mb-3">
	        <label class="form-label">Landmark</label>
	        <input type="text"
	               th:field="*{landmark}"
	               class="form-control">
	    </div>

	    <div class="mb-3">
	        <label class="form-label">City</label>
	        <input type="text"
	               th:field="*{city}"
	               class="form-control"
	               required>
	    </div>

	    <div class="mb-3">
	        <label class="form-label">State</label>
	        <input type="text"
	               th:field="*{state}"
	               class="form-control"
	               required>
	    </div>

	    <div class="mb-3">
	        <label class="form-label">Pincode</label>
	        <input type="text"
	               th:field="*{pincode}"
	               class="form-control"
	               required>
	    </div>

	    <div class="mb-3">
	        <label class="form-label">Country</label>
	        <input type="text"
	               th:field="*{country}"
	               class="form-control"
	               value="India">
	    </div>

	    <div class="mb-3">
	        <label class="form-label">Address Type</label>
	        <select th:field="*{addresstype}" class="form-control">
	            <option value="Home">Home</option>
	            <option value="Office">Office</option>
	            <option value="Other">Other</option>
	        </select>
	    </div>

	    <button type="submit" class="btn btn-dark btn-save">
	        Save Address
	    </button>

	</form>

</div>

</body>
</html>
