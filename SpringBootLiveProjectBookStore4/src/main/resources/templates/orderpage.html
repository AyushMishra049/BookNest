<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">

<title>My Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

.order-box{
    background:white;
    padding:30px;
    border-radius:15px;
    margin-top:40px;
    box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

.heading{
    font-weight:bold;
    margin-bottom:25px;
}

table{
    vertical-align:middle;
}

th{
    padding:15px !important;
}

td{
    padding:15px !important;
}

</style>

</head>

<body>

<div class="container">

    <div class="order-box">

        <h2 class="text-center heading">
            My Orders
        </h2>

        <table class="table table-bordered table-hover text-center">

            <thead class="table-dark">

                <tr>

                    <th>Order ID</th>

                    <th>Book Name</th>

                    <th>Author</th>

                    <th>Quantity</th>

                    <th>Price</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

                <tr th:each="o : ${orders}">

                    <td th:text="${o.id}">
                        1
                    </td>

                    <td th:text="${o.bookname}">
                        Book Name
                    </td>

                    <td th:text="${o.authorname}">
                        Author
                    </td>

                    <td th:text="${o.bookquantity}">
                        1
                    </td>

                    <td>

                        ₹ <span th:text="${o.bookprice}">
                            0
                        </span>

                    </td>

                    <td>

                        <span class="badge bg-warning text-dark"
                              th:if="${o.status == 'Ordered'}"
                              th:text="${o.status}">
                        </span>
						

						<span class="badge bg-danger"
						      th:if="${o.status == 'Shipped'}"
						      th:text="${o.status}">
						</span>

						<span class="badge bg-danger"
						      th:if="${o.status == 'Out For Delivery'}"
						      th:text="${o.status}">
						</span>

                        <span class="badge bg-success"
                              th:if="${o.status == 'Delivered'}"
                              th:text="${o.status}">
                        </span>

                        <span class="badge bg-danger"
                              th:if="${o.status == 'Cancelled'}"
                              th:text="${o.status}">
                        </span>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
