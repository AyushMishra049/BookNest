<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Book</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
            font-family:'Poppins',sans-serif;
        }

        .form-box{
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
        }

        .title{
            font-weight:700;
            color:#6a11cb;
        }

        .btn-add{
            background:#6a11cb;
            color:white;
            border:none;
            padding:12px;
            width:100%;
            border-radius:10px;
            font-weight:600;
        }

        .btn-add:hover{
            background:#2575fc;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="form-box">

                <h2 class="title mb-4">

                    📚 Add New Book

                </h2>
				<div th:if="${successMsg}">
					<h3 style="color: green;" th:text="${successMsg}"></h3>
				</div>
				<div th:if="${errorMsg}">
					<h3 style="color: red;" th:text="${errorMsg}"></h3>
				</div>

				<form th:action="@{/admin/savebook}"
				      th:object="${book}"
				      method="post"
				      enctype="multipart/form-data">

				    <div class="row g-4">

				        <!-- Book Name -->

				        <div class="col-md-6">

				            <label class="form-label">

				                Book Name

				            </label>

				            <input type="text"
				                   th:field="*{name}"
				                   class="form-control"
				                   placeholder="Enter book name">

				        </div>

				        <!-- Author -->

				        <div class="col-md-6">

				            <label class="form-label">

				                Author Name

				            </label>

				            <input type="text"
				                   th:field="*{auther}"
				                   class="form-control"
				                   placeholder="Enter author name">

				        </div>

				        <!-- Price -->

				        <div class="col-md-4">

				            <label class="form-label">

				                Price

				            </label>

				            <input type="number"
				                   th:field="*{price}"
				                   class="form-control">

				        </div>

				        <!-- Category -->

				        <div class="col-md-4">

				            <label class="form-label">

				                Category

				            </label>

				            <select class="form-select"
				                    th:field="*{type}">

				                <option value="Programming">
				                    Programming
				                </option>

				                <option value="Finance">
				                    Finance
				                </option>

				                <option value="Motivation">
				                    Motivation
				                </option>

				                <option value="Fiction">
				                    Fiction
				                </option>

				            </select>

				        </div>

				        <!-- Stock -->

				        <div class="col-md-4">

				            <label class="form-label">

				                Stock

				            </label>

				            <input type="number"
				                   th:field="*{quantity}"
				                   class="form-control">

				        </div>

				        <!-- Image -->
						
						<div class="col-md-12">

						    <label class="form-label">

						        Upload Book Image

						    </label>
							
							<input type="file"
							       name="imagefile"
							       class="form-control"
							       accept="image/*">

						    

						</div>
						
			



				        <!-- Button -->

				        <div class="col-md-12">

				            <button class="btn-add">

				                Add Book

				            </button>

				        </div>

				    </div>

				</form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
