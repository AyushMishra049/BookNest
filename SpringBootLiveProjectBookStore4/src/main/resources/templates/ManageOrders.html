<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Orders</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f4f7fc;
        }

        .main-box{
            background:white;
            border-radius:20px;
            padding:30px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
        }

        .title{
            font-size:32px;
            font-weight:700;
            color:#6a11cb;
            margin-bottom:25px;
        }

        table{
            margin-top:20px;
        }

        thead{
            background:linear-gradient(90deg,#6a11cb,#2575fc);
            color:white;
        }

        th{
            padding:16px !important;
            font-size:16px;
        }

        td{
            padding:16px !important;
            vertical-align:middle;
        }

        tr:hover{
            background:#f9f9f9;
        }

        .status-select{
            border-radius:10px;
            padding:8px;
        }

        .btn-update{
            background:#22c55e;
            color:white;
            border:none;
            padding:8px 16px;
            border-radius:10px;
            font-weight:600;
        }

        .btn-update:hover{
            background:#16a34a;
        }

        .btn-address{
            background:#2563eb;
            color:white;
            border:none;
            padding:8px 16px;
            border-radius:10px;
            font-weight:600;
        }

        .btn-address:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="main-box">

        <h2 class="title">

            📦 Manage Orders

        </h2>
		<div th:if="${successMsg}">
			<h3 style="color: green;" th:text="${successMsg}"></h3>
		</div>
		<div th:if="${errorMsg}">
			<h3 style="color: red;" th:text="${errorMsg}"></h3>
		</div>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>

                <tr>

                    <th>Order ID</th>

                    <th>User</th>

                    <th>Book</th>

                    <th>Phone</th>

                    <th>Price</th>

                    <th>Status</th>

                    <th>Update</th>

                    <th>Address</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="o : ${orders}">

                    <!-- Order ID -->

                    <td th:text="${o.id}">
                        1
                    </td>

                    <!-- User -->

                    <td th:text="${o.username}">
                        Kishan
                    </td>

                    <!-- Book -->

                    <td th:text="${o.bookname}">
                        Core Java
                    </td>

                    <!-- Phone -->

                    <td th:text="${o.phone}">
                        9876543210
                    </td>

                    <!-- Price -->

                    <td>

                        ₹
                        <span th:text="${o.bookprice}">
                            499
                        </span>

                    </td>

                    <!-- Status Dropdown -->

                    <td>

                        <form th:action="@{/admin/updatestatus}"
                              method="post">

                            <input type="hidden"
                                   name="id"
                                   th:value="${o.id}">

                            <select name="status"
                                    class="form-select status-select">

                                <option value="Ordered"
                                        th:selected="${o.status == 'Ordered'}">

                                    Ordered

                                </option>

                                <option value="Shipped"
                                        th:selected="${o.status == 'Shipped'}">

                                    Shipped

                                </option>

                                <option value="Out For Delivery"
                                        th:selected="${o.status == 'Out For Delivery'}">

                                    Out For Delivery

                                </option>

                                <option value="Delivered"
                                        th:selected="${o.status == 'Delivered'}">

                                    Delivered

                                </option>
								
								<option value="Cancelled"
								        th:selected="${o.status == 'Cancelled'}">

									Cancelled

								</option>

                            </select>

                    </td>

                    <!-- Update Button -->

                    <td>

                            <button class="btn-update">

                                Update

                            </button>

                        </form>

                    </td>

                    <!-- Address -->
					<td>

					    <!-- Button -->

					    <button type="button"
					            class="btn btn-primary btn-sm px-3"
					            data-bs-toggle="modal"
					            th:data-bs-target="'#addressModal' + ${o.id}">

					        Check Address

					    </button>

					    <!-- Modal -->

					    <div class="modal fade"
					         th:id="'addressModal' + ${o.id}"
					         tabindex="-1">

					        <div class="modal-dialog modal-dialog-centered">

					            <div class="modal-content rounded-4 border-0 shadow">

					                <!-- Header -->

					                <div class="modal-header text-white"
					                     style="background:#6f16d6;">

					                    <h5 class="modal-title fw-bold">

					                        Address Details

					                    </h5>

					                    <button type="button"
					                            class="btn-close btn-close-white"
					                            data-bs-dismiss="modal">

					                    </button>

					                </div>

					                <!-- Body -->

					                <div class="modal-body p-4">

					                    <div class="border rounded-4 p-3 bg-light">

					                        <p class="mb-2">
					                            <strong>House No :</strong>

					                            <span th:text="${addressMap[o.userid] != null ? addressMap[o.userid].houseno : 'No Address'}">
					                            </span>
					                        </p>

					                        <p class="mb-2">
					                            <strong>Area :</strong>

					                            <span th:text="${addressMap[o.userid] != null ? addressMap[o.userid].area : 'No Area'}">
					                            </span>
					                        </p>

					                        <p class="mb-2">
					                            <strong>Landmark :</strong>

					                            <span th:text="${addressMap[o.userid] != null ? addressMap[o.userid].landmark : 'No Landmark'}">
					                            </span>
					                        </p>

					                        <p class="mb-2">
					                            <strong>City :</strong>

					                            <span th:text="${addressMap[o.userid] != null ? addressMap[o.userid].city : 'No City'}">
					                            </span>
					                        </p>

					                        <p class="mb-2">
					                            <strong>State :</strong>

					                            <span th:text="${addressMap[o.userid] != null ? addressMap[o.userid].state : 'No State'}">
					                            </span>
					                        </p>

					                        <p class="mb-2">
					                            <strong>Pincode :</strong>

					                            <span th:text="${addressMap[o.userid] != null ? addressMap[o.userid].pincode : 'No Pincode'}">
					                            </span>
					                        </p>

					                        <p class="mb-2">
					                            <strong>Country :</strong>

					                            <span th:text="${addressMap[o.userid] != null ? addressMap[o.userid].country : 'No Country'}">
					                            </span>
					                        </p>

					                        <p class="mb-0">
					                            <strong>Address Type :</strong>

					                            <span th:text="${addressMap[o.userid] != null ? addressMap[o.userid].addresstype : 'No Type'}">
					                            </span>
					                        </p>

					                    </div>

					                </div>

					            </div>

					        </div>

					    </div>

					</td>

                   
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
